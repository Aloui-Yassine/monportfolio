<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yassine Aloui · Portfolio</title>
<meta name="description" content="Portfolio de Yassine Aloui, administrateur systèmes et réseaux en alternance chez BMW MINI by MS Groupe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">

<!--
  Page principale du portfolio.
  Le texte se modifie dans contenu.js, les couleurs dans style.css.
  Voir GUIDE.md.
-->
</head>
<body>
<div class="app" id="app" data-tone="paper">
  <div class="progress" id="progress" aria-hidden="true"></div>

  <main class="stage" id="stage" aria-roledescription="présentation" aria-label="Portfolio de Yassine Aloui"></main>

  <nav class="chrome" aria-label="Navigation de la présentation">
    <button class="menu-btn" id="menu" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <rect x="1.5" y="1.5" width="6" height="6" rx="1"/><rect x="10.5" y="1.5" width="6" height="6" rx="1"/>
        <rect x="1.5" y="10.5" width="6" height="6" rx="1"/><rect x="10.5" y="10.5" width="6" height="6" rx="1"/>
      </svg>
      <span class="lbl">Sommaire</span>
    </button>
    <div class="dots" id="dots"></div>
    <div class="arrows">
      <button class="arrow prev" id="prev" type="button" aria-label="Diapo précédente">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 9l5 5"/></svg>
      </button>
      <button class="arrow next" id="next" type="button" aria-label="Diapo suivante">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 4 5 5-5 5"/></svg>
      </button>
    </div>
  </nav>

  <p class="hint" id="hint">Utilisez les flèches ← → du clavier</p>
  <p class="sr-only" id="live" aria-live="polite"></p>
</div>

<script src="contenu.js"></script>
<script src="app.js"></script>
</body>
</html>
